name: Pruebas del frontend DataHorse

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Ejecutar pruebas de Angular
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      # Versiones exactas de package-lock.json y sin ejecutar scripts de instalación de
      # terceros (esbuild, lmdb, etc. traen sus binarios como dependencias opcionales).
      - name: Instalar dependencias del proyecto
        run: npm ci --ignore-scripts

      # Scripts de package.json: usan el Angular CLI instalado desde package-lock.json
      - name: Compilar la aplicación
        run: npm run build

      - name: Ejecutar pruebas con cobertura
        run: npm run test:coverage

      - name: Guardar informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: coverage/
          if-no-files-found: ignore
