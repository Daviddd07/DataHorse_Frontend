<div class="np-page">

  <button
    class="np-back"
    type="button"
    (click)="cancelar()"
  >
    ← Volver al marketplace
  </button>


  <!-- ======================================================
       SELECCIONAR TIPO
  ====================================================== -->

  <ng-container
    *ngIf="paso() === 'tipo'"
  >

    <div class="np-heading">

      <div class="np-plus">
        +
      </div>

      <h1>
        Publica un nuevo ejemplar
      </h1>

      <p>
        Selecciona el tipo de ejemplar que deseas registrar.
      </p>

    </div>


    <div class="np-tipo-opciones">

      <!-- YEGUA -->

      <button
        class="np-tipo-card np-yegua"
        type="button"
        (click)="elegirTipo('Hembra')"
      >

        <div class="np-card-media">

          <img
            class="np-horse-image"
            src="https://images.unsplash.com/photo-1553284965-83fd3e82fa5a?auto=format&fit=crop&w=1400&q=90"
            alt="Yegua"
          />

          <span
            class="np-sex-icon female"
          >
            ♀
          </span>

        </div>


        <div class="np-card-content">

          <div>

            <h2>
              Yegua
            </h2>

            <p>
              Publicar un ejemplar hembra
            </p>

          </div>

          <span class="np-arrow">
            →
          </span>

        </div>

      </button>


      <!-- CABALLO -->

      <button
        class="np-tipo-card np-caballo"
        type="button"
        (click)="elegirTipo('Macho')"
      >

        <div class="np-card-media">

          <img
            class="np-horse-image"
            src="https://images.unsplash.com/photo-1534773728080-33d31da27ae5?auto=format&fit=crop&w=1400&q=90"
            alt="Caballo"
          />

          <span
            class="np-sex-icon male"
          >
            ♂
          </span>

        </div>


        <div class="np-card-content">

          <div>

            <h2>
              Caballo
            </h2>

            <p>
              Publicar un ejemplar macho
            </p>

          </div>

          <span class="np-arrow">
            →
          </span>

        </div>

      </button>

    </div>

  </ng-container>


  <!-- ======================================================
       FORMULARIO
  ====================================================== -->

  <ng-container
    *ngIf="paso() === 'formulario'"
  >

    <div class="np-form-wrapper">

      <button
        class="np-back np-change"
        type="button"
        (click)="volver()"
      >
        ← Cambiar tipo
      </button>


      <div class="np-form-heading">

        <h1>
          Datos de la publicación
        </h1>

        <p>

          Tipo seleccionado:

          <strong>

            {{
              sexo() === 'Hembra'
                ? 'Yegua'
                : 'Caballo'
            }}

          </strong>

        </p>

      </div>


      <form class="np-form">


        <!-- NOMBRE -->

        <label>

          Nombre

          <input
            type="text"
            [value]="nombre()"
            (input)="
              nombre.set(
                $any($event.target).value
              )
            "
          />

        </label>


        <!-- RAZA -->

        <label>

          Raza

          <select
            (change)="
              onRazaChange(
                $any($event.target).value
              )
            "
          >

            <option
              value=""
              disabled
              selected
            >
              Selecciona una raza
            </option>


            <option
              *ngFor="let r of razas()"
              [value]="r.id_raza"
            >
              {{ r.nombre }}
            </option>


            <option value="-1">
              Otro
            </option>

          </select>

        </label>


        <!-- OTRA RAZA -->

        <label
          *ngIf="razaEsOtro()"
        >

          ¿Cuál raza?

          <input
            type="text"
            placeholder="Escribe la raza"
            [value]="razaPersonalizada()"
            (input)="
              razaPersonalizada.set(
                $any($event.target).value
              )
            "
          />

        </label>


        <!-- FECHA -->

        <label>

          Fecha de nacimiento

          <input
            type="date"
            [value]="fechaNacimiento()"
            (input)="
              fechaNacimiento.set(
                $any($event.target).value
              )
            "
          />

          <span class="np-hint">
            Si no conoces la fecha exacta,
            puedes ingresar una aproximada.
          </span>

        </label>


        <!-- ALTURA -->

        <label>

          Altura (metros)

          <input
            type="number"
            min="0"
            step="0.01"
            [value]="altura() ?? ''"
            (input)="
              onAlturaChange(
                $any($event.target).value
              )
            "
          />

        </label>


        <!-- COLOR -->

        <label>

          Color

          <input
            type="text"
            [value]="color()"
            (input)="
              color.set(
                $any($event.target).value
              )
            "
          />

        </label>


        <!-- UBICACIÓN -->

        <label>

          Ubicación

          <input
            type="text"
            [value]="ubicacion()"
            (input)="
              ubicacion.set(
                $any($event.target).value
              )
            "
          />

        </label>


        <!-- PRECIO SOLO CABALLO -->

        <label
          *ngIf="sexo() === 'Macho'"
        >

          Precio

          <div class="np-price-input">

            <span>
              $
            </span>

            <input
              type="number"
              min="1"
              step="1000"
              placeholder="Ej. 3400000"
              [value]="precio() ?? ''"
              (input)="
                onPrecioChange(
                  $any($event.target).value
                )
              "
            />

          </div>

        </label>


        <!-- DESCRIPCIÓN -->

        <label class="np-full">

          Descripción

          <textarea
            [value]="descripcion()"
            (input)="
              descripcion.set(
                $any($event.target).value
              )
            "
          ></textarea>

        </label>


        <!-- DISPONIBILIDAD -->

        <label>

          Disponibilidad

          <select
            (change)="
              onDisponibilidadChange(
                $any($event.target).value
              )
            "
          >

            <option value="Disponible">
              Disponible
            </option>

            <option value="No disponible">
              No disponible
            </option>

          </select>

        </label>


        <!-- ERROR -->

        <p
          class="np-error np-full"
          *ngIf="error()"
        >
          {{ error() }}
        </p>


        <!-- BOTÓN -->

        <button
          class="np-submit np-full"
          type="button"
          [disabled]="enviando()"
          (click)="guardar()"
        >

          {{
            enviando()
              ? 'Guardando...'
              : 'Publicar ejemplar'
          }}

        </button>

      </form>

    </div>

  </ng-container>

</div>
