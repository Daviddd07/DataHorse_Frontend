<div class="login-container">
  <div class="login-card">
    <h1>DataHorse</h1>
    <!-- CAMBIO DE LOGO AQUÍ -->
    <img src="Logo_blanco.png" alt="DataHorse" class="login-logo" />

    <p class="subtitle">Inicia sesión en tu cuenta</p>

    <form (ngSubmit)="iniciarSesion()">
      <div class="form-group">
        <label for="correo"> Correo electrónico </label>
        <input
          type="email"
          id="correo"
          name="correo"
          [(ngModel)]="correo"
          (input)="limpiarMensaje()"
          placeholder="Ingresa tu correo"
          required
          autocomplete="username"
        />
      </div>
      <!-- CAMPO DE CONTRASEÑA -->
      <div class="form-group">
        <label for="password">Contraseña</label>

        <div class="input-password-wrapper">
          <input
            [type]="verPassword() ? 'text' : 'password'"
            id="password"
            name="password"
            [(ngModel)]="password"
            (input)="limpiarMensaje()"
            placeholder="Ingresa tu contraseña"
            required
            autocomplete="current-password"
          />

          <!-- BOTÓN DEL OJITO -->
          <button
            type="button"
            class="btn-ojo"
            (click)="verPassword.set(!verPassword())"
            [attr.aria-label]="verPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            @if (verPassword()) {
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                ></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            } @else {
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            }
          </button>
        </div>
      </div>

      <div class="forgot-password">
        <a routerLink="/recuperar-password"> ¿Olvidaste tu contraseña? </a>
      </div>

      <p *ngIf="mensaje" class="error-message">
        {{ mensaje }}
      </p>

      <p *ngIf="necesitaVerificacion" class="verify-link">
        <a routerLink="/verificar-correo" [queryParams]="{ correo: correo }">
          Verificar mi correo
        </a>
      </p>

      <button type="submit" [disabled]="cargando">
        {{ cargando ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>
    </form>

    <!-- CAMBIO DE COLOR EN LAS LÍNEAS DIVISORIAS -->
    <div class="divider">
      <span class="line"></span>
      <span class="text"> o </span>
      <span class="line"></span>
    </div>

    <div class="google-wrapper">
      <div #googleButton></div>
    </div>

    <p *ngIf="cargandoGoogle" class="google-loading">Conectando con Google...</p>

    <p class="register-link">
      ¿No tienes cuenta? <a href="/registrar" (click)="irARegistro($event)"> Regístrate </a>
    </p>
  </div>
</div>
