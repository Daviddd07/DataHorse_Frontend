@if (aviso(); as a) {
  <div class="am" role="status" aria-live="polite">
    <button type="button" class="am-cuerpo" (click)="abrir()">
      <span class="am-icono" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
      </span>
      <span class="am-texto">
        <strong>Nuevo mensaje de {{ a.remitente }}</strong>
        <small>{{ a.titulo_publicacion }}</small>
        <span class="am-contenido">{{ a.mensaje.contenido }}</span>
      </span>
    </button>
    <button type="button" class="am-cerrar" aria-label="Cerrar aviso" (click)="cerrar()">×</button>
  </div>
}
