server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Redirige todas las rutas al index.html para que Angular maneje el routing
        try_files $uri $uri/ /index.html;
    }

    # Opcional: Cache de archivos estáticos para que cargue más rápido
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}