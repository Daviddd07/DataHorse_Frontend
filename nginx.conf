server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Redirige todas las rutas al index.html para que Angular maneje el routing
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca se reutiliza sin preguntar: es el que apunta a los JS/CSS de cada versión.
    # Sin esto el navegador podía seguir cargando la versión anterior después de un despliegue.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Cache de archivos estáticos para que cargue más rápido
    # (los JS/CSS llevan un hash en el nombre, así que cada versión usa archivos nuevos)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
